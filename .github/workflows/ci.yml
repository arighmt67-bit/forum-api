name: Continuous Integration

on:
  pull_request:
    branches:
      - master

jobs:
  security-scan:
    name: DevSecOps Shift-Left Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret Scanning: Cegah kebocoran token/kredensial di kode & commit history
      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      # 2. Software Composition Analysis (SCA): Deteksi kerentanan kritis pada package dependencies
      - name: Run Trivy Vulnerability Scanner (Filesystem & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  test:
    name: Unit, Integration, and Functional Test
    runs-on: ubuntu-latest

    # Integration dan functional test membutuhkan basis data sungguhan.
    # PostgreSQL dijalankan sebagai service container agar pengujian berjalan
    # lokal di dalam runner, jauh lebih cepat daripada database eksternal.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecret
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Berkas .test.env tidak disertakan di repository demi menjaga kredensial.
      # Nilainya dibangkitkan di sini agar sesuai dengan service container.
      - name: Create test environment file
        run: |
          cat > .test.env <<'ENVFILE'
          HOST=localhost
          PORT=5000
          PGHOST=localhost
          PGUSER=developer
          PGDATABASE=forumapi_test
          PGPASSWORD=supersecret
          PGPORT=5432
          ACCESS_TOKEN_KEY=ci_access_token_key_for_testing_only
          REFRESH_TOKEN_KEY=ci_refresh_token_key_for_testing_only
          ACCESS_TOKEN_AGE=3000
          ENVFILE

      - name: Run database migrations
        run: npm run migrate:test up

      - name: Run all tests with coverage
        run: npm run test:coverage
