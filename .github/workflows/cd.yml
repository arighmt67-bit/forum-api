name: Continuous Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deployment dilakukan melalui SSH ke server produksi.
      # Seluruh nilai sensitif disimpan sebagai repository secrets,
      # bukan dituliskan langsung pada berkas workflow.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd ~/forum-api

            # Menyimpan commit yang sedang berjalan sebagai acuan rollback.
            PREVIOUS_COMMIT=$(git rev-parse --short HEAD)

            # Mengambil kode terbaru dari branch utama.
            git fetch origin master
            git reset --hard origin/master

            # Memasang dependensi sesuai package-lock.json.
            npm ci --omit=dev

            # Menjalankan migrasi basis data produksi.
            npm run migrate up

            # Memuat ulang aplikasi tanpa waktu henti.
            # Bila proses belum terdaftar, aplikasi dijalankan pertama kali.
            pm2 reload forum-api --update-env || pm2 start src/app.js --name forum-api
            pm2 save

            # Verifikasi deployment: aplikasi harus menjawab /health dengan 200
            # (artinya proses hidup dan database terjangkau). Dicoba beberapa kali
            # karena aplikasi butuh beberapa detik untuk siap setelah reload.
            HEALTH_URL="http://127.0.0.1:${PORT:-5000}/health"
            healthy=false
            for attempt in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
              echo "Verifikasi $attempt/10: $HEALTH_URL -> $code"
              if [ "$code" = "200" ]; then healthy=true; break; fi
              sleep 3
            done

            if [ "$healthy" != "true" ]; then
              echo "::error::Verifikasi deployment gagal. Commit sebelumnya: $PREVIOUS_COMMIT"
              pm2 status
              pm2 logs forum-api --lines 30 --nostream || true
              echo "Rollback manual: lihat RUNBOOK.md bagian 4."
              exit 1
            fi
            echo "Deployment terverifikasi: $(git rev-parse --short HEAD)"
